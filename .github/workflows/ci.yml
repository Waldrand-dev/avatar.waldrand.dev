name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - run: npm ci
      - run: npm ci --prefix site

      # The docs are part of the build, and a type error in a dictionary is a
      # broken page rather than a broken string.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run --prefix site check
      - run: npm test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: avatar-waldrand:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
