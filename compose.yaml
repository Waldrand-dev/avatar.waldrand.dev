# A single service with nothing behind it: no database, no cache, no volume.
# `docker compose up` is the whole deployment.
services:
  avatar:
    build: .
    image: ghcr.io/waldrand-dev/avatar.waldrand.dev:latest
    restart: unless-stopped
    # Exposed to the Docker network only, not bound on the host: the reverse
    # proxy (Coolify's Traefik) reaches it there, and a host binding would
    # collide with anything else on the machine that already holds 8080.
    expose:
      - "8080"
    environment:
      # The origin printed in the docs' examples and in error bodies.
      PUBLIC_ORIGIN: https://avatar.waldrand.dev
      # Behind one reverse proxy that sets X-Forwarded-For. Leave at 0 when the
      # container is exposed directly, or the limiter can be sidestepped with a
      # forged header.
      TRUST_PROXY_HOPS: "1"
      # Opens /stats, the operator's own request chart. Set it in the
      # deployment's secrets - never here - and generate it with
      # `openssl rand -hex 32`. Unset, the route does not exist.
      STATS_TOKEN: ${STATS_TOKEN:-}
      STATS_TIMEZONE: ${STATS_TIMEZONE:-Europe/Berlin}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # libvips is the only thing here that wants memory, and only while a
          # PNG is being written.
          memory: 512M
